name: Continuous Integration and tests
run-name: Kayongo is running tests.
## So this basically tells the github actions to run the tests whenever i push the code.
on: [push]
jobs:
  Tests:
    runs-on: ubuntu-latest
    steps:
      -name: Copy the repository code into the empty virtual environment.
      -uses: actions/checkout@v4

      -name: List files in the repo
      -uses: 
          echo "The workflow was automatically triggered by a ${{ github.event_name }} event."
          echo "This job is now running on a ${{ github.runner_os }} server hosted by GitHub!"
          ls ${{ github.workspace }}
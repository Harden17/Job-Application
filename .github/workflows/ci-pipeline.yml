name: Continuous Integration

on:
  push:
    branches: [ main ]
  # this pull request means that someone wants to merge their code into our main branch  
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. copy the repo files to the empty virtual machine.
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup the Node runtime engine with automated NPM caching
      - name: Setup Node.js
        # this tells us to install prebuils note then with we add specifications.
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          # This helps us save time by automatically using the already installed tools and dependencies.
          cache: 'npm'

      # 3. Clean install your production and development modules
      - name: Install Dependencies
        # this is going to install everything cleans our node_modules file then installs everything once again.
        run: npm ci

      # 4. Generate your local Prisma Client artifacts from your schema file
      - name: Generate Prisma Client
        run: npx prisma generate

      # 5. Compile TypeScript files to ensure there are no static type errors
      - name: Run Type Check
        run: npx tsc --noEmit

      # 6. Execute your Jest test suite to check application logic
      - name: Run Jest Test Suite
        env:
          jwtsecret: ${{ secrets.JWT_SECRET }} 
        run: npm test

version: "3"

services:
   db:
    image: postgres:13
    container_name: japplication-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_application
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data        

volumes:
  postgres_data:   